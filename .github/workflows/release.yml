name: Release

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/app/release-keystore.p12
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}

      - name: Build All Release APKs
        run: ./gradlew assembleNormalRelease assembleFdroidRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-signed-all-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk

      - name: Create & Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automatic Release build from workflow.
            Build Number: ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/normal/release/*.apk
            app/build/outputs/apk/fdroid/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
