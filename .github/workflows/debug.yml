name: Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Cache Debug Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: app/keystore/debug.keystore
          key: ${{ runner.os }}-debug-keystore-v2

      - name: Build APK (NormalDebug)
        run: |
          mkdir -p app/keystore
          if [ "${{ steps.cache-keystore.outputs.cache-hit }}" != "true" ]; then
            echo "Generating NEW persistent keystore..."
            keytool -genkey -v -keystore app/keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          else
            echo "Using cached persistent keystore."
          fi
          ./gradlew assembleNormalDebug

      - name: Delete Old Artifacts
        uses: actions/github-script@v6
        id: artifact
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
          
            for (const artifact of res.data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                })
            }

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/normal/debug/*.apk

      - name: Create & Upload Debug Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v${{ github.run_number }}
          name: Debug Build v${{ github.run_number }}
          body: |
            Debug build for testing.
            Build Number: ${{ github.run_number }}
          draft: false
          prerelease: true
          files: app/build/outputs/apk/normal/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
